<h1>idea-validator — structural audit</h1>
<div class="subtitle">What connects to what, where the gaps are, and which rules float</div>

<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">

  </defs>

  <rect width="1200" height="1400" fill="#fafaf9"/>

  <!-- LAYER 2: MODE DISPATCH -->
  <rect x="40" y="120" width="800" height="70" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="60" y="145" font-size="13" font-weight="600" fill="#0f172a">MODE DISPATCH</text>
  <rect x="60" y="155" width="140" height="28" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
  <text x="130" y="174" text-anchor="middle" font-size="11" fill="#475569">quick_screen</text>
  <rect x="210" y="155" width="170" height="28" fill="#dbeafe" stroke="#3b82f6" rx="4"/>

  <line x1="295" y1="190" x2="295" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LAYER 3: WORKFLOW (left col) and OUTPUT (right col) -->
  <text x="160" y="215" font-size="13" font-weight="600" fill="#0f172a">WORKFLOW (14 steps, full_validation)</text>
  <text x="650" y="215" font-size="13" font-weight="600" fill="#0f172a">OUTPUT STRUCTURE (12 sections)</text>

  <!-- PHASE: FRAME -->
  <rect x="40" y="230" width="380" height="80" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="250" font-size="11" font-weight="600" fill="#0891b2">FRAME</text>
  <text x="60" y="270" font-size="11" fill="#334155">1. Restate the idea (founder's + sharpest + gap)</text>
  <text x="60" y="286" font-size="11" fill="#334155">2. Reality check (search competitors)</text>
  <text x="60" y="302" font-size="10" fill="#94a3b8" font-style="italic">  → triggers Rule 14 (use search)</text>

  <rect x="500" y="230" width="380" height="80" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="250" font-size="11" font-weight="600" fill="#0891b2">FRAME OUTPUT</text>
  <text x="520" y="270" font-size="11" fill="#334155">§1 Restated idea</text>
  <text x="520" y="286" font-size="11" fill="#334155">§2 Reality check</text>

  <line x1="420" y1="270" x2="500" y2="270" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="286" x2="500" y2="286" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PHASE: DIAGNOSE -->
  <rect x="40" y="320" width="380" height="100" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="340" font-size="11" font-weight="600" fill="#0891b2">DIAGNOSE</text>
  <text x="60" y="360" font-size="11" fill="#334155">3. Pressure-test problem (frequency, intensity)</text>
  <text x="60" y="376" font-size="11" fill="#334155">4. Rank segments (5-axis score)</text>
  <text x="60" y="392" font-size="11" fill="#334155">5. Pressure-test solution (lighter form?)</text>
  <text x="60" y="411" font-size="10" fill="#b91c1c" font-style="italic">⚠ Steps 3 &amp; 5 have no dedicated output section</text>

  <rect x="500" y="320" width="380" height="100" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="340" font-size="11" font-weight="600" fill="#0891b2">DIAGNOSE OUTPUT</text>
  <text x="520" y="360" font-size="11" fill="#334155">§3 Segment ranking (beachhead + 2nd)</text>
  <text x="520" y="380" font-size="10" fill="#94a3b8" font-style="italic">(steps 3, 5 fold into §3, §4 — no own section)</text>

  <line x1="420" y1="376" x2="500" y2="360" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PHASE: DEFINE -->
  <rect x="40" y="430" width="380" height="80" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="450" font-size="11" font-weight="600" fill="#0891b2">DEFINE</text>
  <text x="60" y="470" font-size="11" fill="#334155">6. Narrowest credible MVP (in/NOT-in v1)</text>
  <text x="60" y="486" font-size="11" fill="#334155">7. Trust / privacy / regulatory posture</text>
  <text x="60" y="502" font-size="10" fill="#94a3b8" font-style="italic">  → triggers Rules 3, 5, 12, 13</text>

  <rect x="500" y="430" width="380" height="80" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="450" font-size="11" font-weight="600" fill="#0891b2">DEFINE OUTPUT</text>
  <text x="520" y="470" font-size="11" fill="#334155">§4 MVP (in v1, NOT in v1, distractions)</text>
  <text x="520" y="486" font-size="11" fill="#334155">§5 Trust / regulatory posture</text>

  <line x1="420" y1="470" x2="500" y2="470" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="486" x2="500" y2="486" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PHASE: ASSESS -->
  <rect x="40" y="520" width="380" height="110" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="540" font-size="11" font-weight="600" fill="#0891b2">ASSESS</text>
  <text x="60" y="560" font-size="11" fill="#334155">8. Business model (rank 4–8 paths)</text>
  <text x="60" y="576" font-size="11" fill="#334155">9. Retention &amp; defensibility</text>
  <text x="60" y="592" font-size="11" fill="#334155">10. Map competition (two-question X/Y/Z) ★</text>
  <text x="60" y="611" font-size="10" fill="#b91c1c" font-style="italic">⚠ Step 10 splits across §7 + §10 — no own home</text>

  <rect x="500" y="520" width="380" height="110" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="540" font-size="11" font-weight="600" fill="#0891b2">ASSESS OUTPUT</text>
  <text x="520" y="560" font-size="11" fill="#334155">§6 Business model (with realistic shape)</text>
  <text x="520" y="576" font-size="11" fill="#334155">§7 Retention + death scenario</text>
  <text x="520" y="596" font-size="10" fill="#b91c1c" font-style="italic">(competition mapping wedged in here)</text>

  <line x1="420" y1="560" x2="500" y2="560" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="576" x2="500" y2="576" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="592" x2="500" y2="596" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>

  <!-- PHASE: DECIDE -->
  <rect x="40" y="640" width="380" height="100" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="660" font-size="11" font-weight="600" fill="#0891b2">DECIDE</text>
  <text x="60" y="680" font-size="11" fill="#334155">11. Top 5 risks (prob × damage)</text>
  <text x="60" y="696" font-size="11" fill="#334155">12. Validation plan (sequenced tests)</text>
  <text x="60" y="712" font-size="11" fill="#334155">13. Verdict: go / narrow / pivot / kill</text>
  <text x="60" y="731" font-size="10" fill="#94a3b8" font-style="italic">  → triggers Rules 4, 6, 7, 8, 15, 16</text>

  <rect x="500" y="640" width="380" height="100" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="660" font-size="11" font-weight="600" fill="#0891b2">DECIDE OUTPUT</text>
  <text x="520" y="680" font-size="11" fill="#334155">§8 Top 5 risks (ranked)</text>
  <text x="520" y="696" font-size="11" fill="#334155">§9 Validation plan</text>
  <text x="520" y="712" font-size="11" fill="#334155">§10 Verdict + shape of ambition</text>

  <line x1="420" y1="680" x2="500" y2="680" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="696" x2="500" y2="696" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="712" x2="500" y2="712" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PHASE: CLOSE -->
  <rect x="40" y="750" width="380" height="60" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="60" y="770" font-size="11" font-weight="600" fill="#0891b2">CLOSE</text>
  <text x="60" y="790" font-size="11" fill="#334155">14. Final synthesis</text>

  <rect x="500" y="750" width="380" height="60" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="520" y="770" font-size="11" font-weight="600" fill="#0891b2">CLOSE OUTPUT</text>
  <text x="520" y="788" font-size="11" fill="#334155">§11 Sharpest version  ·  §12 Kill signal</text>

  <line x1="420" y1="790" x2="500" y2="788" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CROSS-CUTTING -->
  <text x="160" y="850" font-size="13" font-weight="600" fill="#0f172a">CROSS-CUTTING CONCERNS (always active, weakly gated)</text>

  <rect x="40" y="865" width="280" height="200" fill="#fff8f1" stroke="#fb923c" stroke-width="1" rx="4"/>
  <text x="60" y="885" font-size="11" font-weight="600" fill="#9a3412">16 Non-negotiable rules</text>
  <text x="60" y="905" font-size="10" fill="#475569">Gated (have a workflow step):</text>
  <text x="60" y="920" font-size="10" fill="#16a34a">✓ Rules 3, 12, 13, 14, 15, 16</text>
  <text x="60" y="940" font-size="10" fill="#475569">Partially gated:</text>
  <text x="60" y="955" font-size="10" fill="#ca8a04">~ Rules 4, 5, 6, 7, 8</text>
  <text x="60" y="975" font-size="10" fill="#475569">Floating (no enforcement step):</text>
  <text x="60" y="990" font-size="10" fill="#b91c1c">✗ Rule 1 (strong AND weak)</text>
  <text x="60" y="1005" font-size="10" fill="#b91c1c">✗ Rule 2 (product vs business)</text>
  <text x="60" y="1020" font-size="10" fill="#b91c1c">✗ Rule 9 (no generic advice)</text>
  <text x="60" y="1035" font-size="10" fill="#b91c1c">✗ Rule 10 (no flattery)</text>
  <text x="60" y="1050" font-size="10" fill="#b91c1c">✗ Rule 11 (call out fantasy)</text>

  <rect x="340" y="865" width="280" height="200" fill="#fff8f1" stroke="#fb923c" stroke-width="1" rx="4"/>
  <text x="360" y="885" font-size="11" font-weight="600" fill="#9a3412">12 Founder-fantasy patterns</text>
  <text x="360" y="905" font-size="10" fill="#475569">All 12 float — no specific trigger step.</text>
  <text x="360" y="920" font-size="10" fill="#475569">Model decides when to invoke.</text>
  <text x="360" y="940" font-size="10" fill="#b91c1c">⚠ Largest enforcement gap in skill.</text>
  <text x="360" y="960" font-size="10" fill="#475569">Implicit binding (could be made explicit):</text>
  <text x="360" y="975" font-size="10" fill="#334155">  · platform-language → Step 6 (MVP)</text>
  <text x="360" y="990" font-size="10" fill="#334155">  · venture overreach → Step 8 (Biz model)</text>
  <text x="360" y="1005" font-size="10" fill="#334155">  · competitor-as-validation → Step 10</text>
  <text x="360" y="1020" font-size="10" fill="#334155">  · privacy/trust intuition → Step 7</text>
  <text x="360" y="1035" font-size="10" fill="#334155">  · "second movers win" → Step 10</text>
  <text x="360" y="1050" font-size="10" fill="#334155">  · "alongside my day job" → Step 12</text>

  <rect x="640" y="865" width="240" height="200" fill="#fff8f1" stroke="#fb923c" stroke-width="1" rx="4"/>
  <text x="660" y="885" font-size="11" font-weight="600" fill="#9a3412">Style + Verdict vocab</text>
  <text x="660" y="905" font-size="10" fill="#475569">Style: direct, no hype, no clichés.</text>
  <text x="660" y="920" font-size="10" fill="#94a3b8">  (enforcement: vibes-based)</text>
  <text x="660" y="945" font-size="10" fill="#475569">Verdicts:</text>
  <text x="660" y="960" font-size="10" fill="#16a34a">  · go (requires X/Y/Z)</text>
  <text x="660" y="975" font-size="10" fill="#16a34a">  · narrow (requires X/Y/Z)</text>
  <text x="660" y="990" font-size="10" fill="#ca8a04">  · pivot (specify the pivot)</text>
  <text x="660" y="1005" font-size="10" fill="#b91c1c">  · kill (no softening)</text>
  <text x="660" y="1025" font-size="10" fill="#475569">Enforcement: Rule 16 ties to §10.</text>
  <text x="660" y="1045" font-size="10" fill="#16a34a">✓ Most explicit gate in skill.</text>

  <!-- X/Y/Z TEST PANEL -->
  <rect x="900" y="230" width="270" height="835" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
  <text x="920" y="255" font-size="12" font-weight="600" fill="#1e3a8a">X/Y/Z ENTRY TEST</text>
  <text x="920" y="273" font-size="10" fill="#1e40af">The cross-cutting structural gate</text>

  <text x="920" y="300" font-size="10" fill="#334155" font-weight="600">Referenced in 6 places:</text>
  <text x="920" y="318" font-size="10" fill="#1e40af">• Step 2 (Reality check)</text>
  <text x="920" y="334" font-size="10" fill="#1e40af">• Step 10 (Map competition)</text>
  <text x="920" y="350" font-size="10" fill="#1e40af">• Rule 15 (apply both questions)</text>
  <text x="920" y="366" font-size="10" fill="#1e40af">• Rule 16 (verdict requires X/Y/Z)</text>
  <text x="920" y="382" font-size="10" fill="#1e40af">• Section "Competitor analysis"</text>
  <text x="920" y="398" font-size="10" fill="#1e40af">• Verdict vocabulary (go/narrow)</text>

  <text x="920" y="430" font-size="10" fill="#334155" font-weight="600">The test:</text>
  <text x="920" y="448" font-size="9" fill="#475569">"[Incumbent X] cannot do [Y]</text>
  <text x="920" y="462" font-size="9" fill="#475569">because [Y requires Z],</text>
  <text x="920" y="476" font-size="9" fill="#475569">and [Z is something I can build</text>
  <text x="920" y="490" font-size="9" fill="#475569">/ be / access that they</text>
  <text x="920" y="504" font-size="9" fill="#475569">structurally cannot]."</text>

  <text x="920" y="535" font-size="10" fill="#334155" font-weight="600">Enforcement strength:</text>
  <text x="920" y="553" font-size="10" fill="#16a34a">✓ Strongest gate in the skill</text>
  <text x="920" y="569" font-size="10" fill="#16a34a">✓ Most-bound concept (6 refs)</text>
  <text x="920" y="585" font-size="10" fill="#ca8a04">~ Still self-checked by model</text>
  <text x="920" y="601" font-size="10" fill="#ca8a04">~ No external validator step</text>

  <text x="920" y="630" font-size="10" fill="#334155" font-weight="600">Coverage check:</text>
  <text x="920" y="648" font-size="10" fill="#16a34a">✓ Demand-validation question</text>
  <text x="920" y="664" font-size="10" fill="#16a34a">✓ Entry-justification question</text>
  <text x="920" y="680" font-size="10" fill="#16a34a">✓ Second-mover conditional logic</text>
  <text x="920" y="696" font-size="10" fill="#16a34a">✓ Verdict downgrade if X/Y/Z missing</text>

  <text x="920" y="725" font-size="10" fill="#334155" font-weight="600">Potential improvement:</text>
  <text x="920" y="743" font-size="9" fill="#475569">Add a structured X/Y/Z output</text>
  <text x="920" y="757" font-size="9" fill="#475569">field to §10 (Verdict) so the</text>
  <text x="920" y="771" font-size="9" fill="#475569">model must literally fill in</text>
  <text x="920" y="785" font-size="9" fill="#475569">the X, Y, and Z before</text>
  <text x="920" y="799" font-size="9" fill="#475569">stating "go" or "narrow".</text>

  <!-- PROBLEMS PANEL -->
  <rect x="40" y="1085" width="1130" height="290" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  <text x="60" y="1110" font-size="13" font-weight="600" fill="#991b1b">STRUCTURAL DEFECTS SURFACED BY THIS DIAGRAM</text>

  <text x="60" y="1135" font-size="11" font-weight="600" fill="#7f1d1d">1. Step 10 (Map competition) has no dedicated output section.</text>
  <text x="60" y="1150" font-size="10" fill="#475569">It bleeds into §7 (death scenario) and §10 (verdict). The new X/Y/Z framework is structurally critical but homeless.</text>
  <text x="60" y="1165" font-size="10" fill="#475569">Fix: add §6.5 "Competitive entry test" OR rename §10 to "Competition &amp; Verdict" with explicit X/Y/Z subsection.</text>

  <text x="60" y="1190" font-size="11" font-weight="600" fill="#7f1d1d">2. Steps 3 &amp; 5 (pressure-test problem / solution) produce no own section.</text>
  <text x="60" y="1205" font-size="10" fill="#475569">Probably fine — these feed §3 and §4. Not a defect, but they exist only as workflow, not as deliverable.</text>

  <text x="60" y="1230" font-size="11" font-weight="600" fill="#7f1d1d">3. All 12 founder-fantasy patterns are completely ungated.</text>
  <text x="60" y="1245" font-size="10" fill="#475569">The largest drift surface in the skill. Model decides when to invoke each pattern.</text>
  <text x="60" y="1260" font-size="10" fill="#475569">Fix: bind each pattern to a workflow step (mapped in the cross-cutting panel above) OR add a dedicated audit step before §10.</text>

  <text x="60" y="1285" font-size="11" font-weight="600" fill="#7f1d1d">4. Five rules (1, 2, 9, 10, 11) have no enforcement gate.</text>
  <text x="60" y="1300" font-size="10" fill="#475569">"Identify strong AND weak", "product vs business logic", "no generic advice", "no flattery", "call out founder fantasy" — all float.</text>
  <text x="60" y="1315" font-size="10" fill="#475569">Likely OK in practice (these are tonal/stance rules the model holds throughout) but invisible failure mode if they slip.</text>

  <text x="60" y="1340" font-size="11" font-weight="600" fill="#7f1d1d">5. The X/Y/Z test is well-bound but self-checked.</text>
  <text x="60" y="1355" font-size="10" fill="#475569">Strongest gate in the skill — but enforcement still relies on the model honestly running the check. There is no external validator step.</text>
